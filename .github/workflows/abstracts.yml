name: Formal abstract PDFs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "ComplexityTests/Abstracts/**"
      - "abstracts/**"
      - "scripts/abstract_to_tex.py"
      - "scripts/build_abstracts.py"
      - "scripts/test_abstract*.py"
      - "scripts/test_build_abstracts.py"
      - "scripts/check_abstract_ci.py"
      - "scripts/test_check_abstract_ci.py"
      - ".github/workflows/abstracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abstracts-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the curated selection
        run: python3 -B scripts/build_abstracts.py --check
      - name: Install PDF tooling and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk lmodern texlive-latex-extra texlive-fonts-extra texlive-science \
            texlive-plain-generic poppler-utils
      - name: Test abstract generation
        run: python3 -B -m unittest discover -s scripts -p 'test_*abstract*.py'
      - name: Build individual PDFs, catalogue and provenance
        run: python3 -B scripts/build_abstracts.py --require-clean
      - name: Upload review artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: formal-abstracts-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            abstracts/build/*.pdf
            abstracts/build/provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Link the source-pinned review artifact
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path("abstracts/build/provenance.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"[Download formal abstracts and provenance]({os.environ['ARTIFACT_URL']})\n\n")
              summary.write(f"Checked-out source: `{source['source_sha']}`\n\n")
              if source["pull_request_head_sha"]:
                  summary.write(f"PR head: `{source['pull_request_head_sha']}`\n\n")
                  summary.write(f"PR base: `{source['pull_request_base_sha']}`\n\n")
              summary.write("Inspect rendered pages and source links before integration.\n")
          PY

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the PDF build's immutable artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: abstract-artifact
      - name: Publish PDFs for the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only this helper may issue release mutations. Recheck the current
          # run/attempt and main before every write, including asset deletion.
          publish() {
            python3 -B scripts/check_abstract_ci.py
            gh release "$@" --repo "$GITHUB_REPOSITORY"
          }
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "A newer main revision exists; its workflow will publish the PDFs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("abstract-artifact")
          source = json.loads((root / "provenance.json").read_text())
          assert source["source_sha"] == os.environ["GITHUB_SHA"], "Source SHA mismatch"
          assert source["repository"] == os.environ["GITHUB_REPOSITORY"], "Repository mismatch"
          assert source["event"] == "push" and source["ref"] == "refs/heads/main", "Not a main build"
          assert not source["source_dirty"], "Artifact was built from modified sources"
          documents = [source["catalogue"], *source["documents"]]
          assert {p.name for p in root.glob("*.pdf")} == {d["pdf"] for d in documents}, "PDF inventory mismatch"
          for document in documents:
              pdf = root / document["pdf"]
              assert pdf.parent == root, "Invalid PDF path"
              assert hashlib.sha256(pdf.read_bytes()).hexdigest() == document["pdf_sha256"], "PDF digest mismatch"
          repository = os.environ["GITHUB_REPOSITORY"]
          Path("release-notes.md").write_text(
              "Generated Lean formal abstracts from main; this is not a source release.\n\n"
              f"Source: [{source['source_sha']}](https://github.com/{repository}/commit/{source['source_sha']})\n\n"
              f"Build: {source['run_url']}\n\n"
              "Download catalogue.pdf, the individual topic PDFs and provenance.json. "
              "The fixed tag is a download anchor; provenance identifies the exact source revision.\n"
          )
          PY
          # Lean CI runs independently. Reuse its authoritative push/main result
          # for this exact source; never accept a PR merge or an older green SHA.
          python3 -B scripts/check_abstract_ci.py --wait-seconds 1200
          if ! gh release view formal-abstracts --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            publish create formal-abstracts \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Formal abstracts (generated from main)" --notes-file release-notes.md
          fi
          # Retired topics must not linger as apparent members of the current catalogue.
          gh release view formal-abstracts --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > release-assets.txt
          while IFS= read -r asset; do
            case "$asset" in
              *.pdf)
                if [ ! -f "abstract-artifact/$asset" ]; then
                  publish delete-asset formal-abstracts "$asset" --yes
                fi
                ;;
            esac
          done < release-assets.txt
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            exit 0
          fi
          publish upload formal-abstracts --clobber \
            abstract-artifact/*.pdf abstract-artifact/provenance.json
          publish edit formal-abstracts \
            --prerelease --latest=false --title "Formal abstracts (generated from main)" \
            --notes-file release-notes.md
          echo "[Latest catalogue PDF](https://github.com/$GITHUB_REPOSITORY/releases/download/formal-abstracts/catalogue.pdf)" >> "$GITHUB_STEP_SUMMARY"
