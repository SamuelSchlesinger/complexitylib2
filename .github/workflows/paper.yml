name: Theorem index PDF

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "paper/**"
      - "references.bib"
      - "scripts/build_paper.py"
      - "scripts/pin_paper_links.py"
      - "scripts/proof_lengths.py"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: pinned \declat links are verified against the commits they name.
          fetch-depth: 0
      - name: Check declaration links
        # -B: no __pycache__, so build_paper.py still records a clean source tree.
        run: python3 -B scripts/pin_paper_links.py --check
      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Build PDF and source provenance
        run: python3 scripts/build_paper.py
      - name: Upload review artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: theorem-index-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            paper/build/main.pdf
            paper/build/provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Link review artifact
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path("paper/build/provenance.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"[Download PDF and source provenance]({os.environ['ARTIFACT_URL']})\n\n")
              summary.write(f"Checked-out source: `{source['source_sha']}`\n\n")
              if source["pull_request_head_sha"]:
                  summary.write(f"PR head: `{source['pull_request_head_sha']}`\n\n")
                  summary.write(f"PR base: `{source['pull_request_base_sha']}`\n\n")
              summary.write("Review the rendered PDF and verify declaration links against these revisions.\n")
          PY

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theorem-index-${{ github.sha }}-${{ github.run_attempt }}
          path: paper-artifact
      - name: Publish the current main document
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "A newer main revision exists; its workflow will publish the PDF." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = json.loads(Path("paper-artifact/provenance.json").read_text())
          assert source["source_sha"] == os.environ["GITHUB_SHA"], "Artifact source SHA mismatch"
          assert source["repository"] == os.environ["GITHUB_REPOSITORY"], "Artifact repository mismatch"
          assert source["event"] == "push" and source["ref"] == "refs/heads/main", "Not a main build"
          assert not source["source_dirty"], "Artifact was built from modified sources"
          assert source["pdf_sha256"] == hashlib.sha256(Path("paper-artifact/main.pdf").read_bytes()).hexdigest(), "PDF digest mismatch"
          repository = os.environ["GITHUB_REPOSITORY"]
          Path("release-notes.md").write_text(
              "Generated theorem-index document from the main branch; this is not a source release.\n\n"
              f"Source: [{source['source_sha']}](https://github.com/{repository}/commit/{source['source_sha']})\n\n"
              f"Build: {source['run_url']}\n\n"
              "Download main.pdf and provenance.json below. The tag is a fixed download anchor; "
              "the source revision above identifies the current PDF.\n"
          )
          PY
          if ! gh release view theorem-index --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create theorem-index --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Theorem index (generated from main)" --notes-file release-notes.md
          fi
          gh release upload theorem-index --repo "$GITHUB_REPOSITORY" --clobber \
            paper-artifact/main.pdf paper-artifact/provenance.json
          gh release edit theorem-index --repo "$GITHUB_REPOSITORY" \
            --prerelease --latest=false --title "Theorem index (generated from main)" \
            --notes-file release-notes.md
          echo "[Latest main PDF](https://github.com/$GITHUB_REPOSITORY/releases/download/theorem-index/main.pdf)" >> "$GITHUB_STEP_SUMMARY"

  # Temporary review transport. Replace integrate/bounded-batch-20261022 before adding under jobs.
  review-export:
    if: github.event_name == 'pull_request' && github.head_ref == 'integrate/bounded-batch-20261022'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theorem-index-${{ github.sha }}-${{ github.run_attempt }}
          path: review-artifact
      - name: Export verified public PDF for review
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("review-artifact")
          provenance = json.loads((root / "provenance.json").read_text())
          pdf = (root / "main.pdf").read_bytes()
          assert provenance["repository"] == os.environ["EXPECTED_REPOSITORY"]
          assert provenance["source_sha"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert provenance["pull_request_head_sha"] == os.environ["EXPECTED_PR_HEAD_SHA"]
          assert provenance["event"] == "pull_request" and not provenance["source_dirty"]
          assert provenance["pdf_sha256"] == hashlib.sha256(pdf).hexdigest()
          assert pdf.startswith(b"%PDF-") and len(pdf) <= 8 * 1024 * 1024
          encoded = base64.b64encode(pdf).decode("ascii")
          chunks = [encoded[i:i + 8192] for i in range(0, len(encoded), 8192)]
          print("THEOREM_REVIEW_META " + json.dumps({
              "provenance": provenance, "pdf_bytes": len(pdf), "chunks": len(chunks)
          }, sort_keys=True))
          for index, chunk in enumerate(chunks):
              print(f"THEOREM_REVIEW_PDF {index + 1}/{len(chunks)} {chunk}")
          PY
