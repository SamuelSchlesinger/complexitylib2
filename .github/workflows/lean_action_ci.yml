name: Lean Action CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the remote-cache upload on `main` pushes uses this; the Google Cloud identity pool
      # also refuses tokens for any other repository, ref or event (scripts/cache/README.md).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Test documentation checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail --iofail @complexitylib @mathlib/mk_all @/checkInitImports @mathlib/lint-style"
          test-args: "--wfail --iofail"
      - name: "lake exe mk_all --check"
        run: |
          set -e
          lake exe mk_all --check
      - name: "lake exe lint-style"
        run: |
          set -e
          lake exe lint-style
      - name: "checkInitImports"
        run: |
          set -e
          lake exe checkInitImports
      # Input-to-output mappings of this build, for diagnosing remote-cache misses.
      - name: "Record build-output mappings"
        run: |
          set -e
          lake build Complexity ComplexityTests -o lake-mappings.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lake-mappings
          path: lake-mappings.jsonl
          retention-days: 14
      # Publish the build outputs to the remote cache read by scripts/cache/get.sh. Skipped until
      # the maintainer sets the repository variables described in scripts/cache/README.md.
      - name: "Authenticate to the remote cache"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LAKE_CACHE_BUCKET != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.LAKE_CACHE_WIF_PROVIDER }}
          service_account: ${{ vars.LAKE_CACHE_SERVICE_ACCOUNT }}
      - name: "Upload to the remote cache"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LAKE_CACHE_BUCKET != ''
        run: |
          set -e
          scripts/cache/upload.sh "${{ vars.LAKE_CACHE_BUCKET }}"
