name: Lean Action CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

# A new run for a pull request cancels that pull request's superseded run. Push runs on `main`
# share `lean-ci-main` without `cancel-in-progress`: the active `main` run finishes and uploads the
# `.lake` and remote caches, while intermediate `main` pushes are replaced by the latest `main` tip
# while pending (which is also the only revision `abstracts.yml` and `scripts/check_abstract_ci.py`
# publish). Merge-queue groups and manual runs each use their own run id so all of them complete.
concurrency:
  group: >-
    lean-ci-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' ||
      github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the remote-cache upload on `main` pushes uses this; the Google Cloud identity pool
      # also refuses tokens for any other repository, ref or event (scripts/cache/README.md).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Test documentation checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: "Source hygiene"
        run: python3 -B scripts/check_hygiene.py --check-simp
      # lean-action has no hook between installing the toolchain and building, so here it only
      # installs elan and fetches Mathlib's cache. The steps around it do the rest of what it did:
      # restore and save `.lake` under the same Actions cache key, then build, test and lint.
      - name: Restore .lake from the Actions cache
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
      # Download the outputs that `main` CI uploaded for the nearest uploaded ancestor of this
      # commit, skipping modules that `.lake` already has (scripts/cache/README.md). The script
      # deepens the depth-1 checkout to 100 generations to find that ancestor. Lake reuses an
      # output only where a module's input hash matches, so the build below still compiles every
      # module this commit affects. A miss, a timeout or an unreachable bucket only leaves the
      # build colder.
      - name: Restore build outputs from the remote cache
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/cache/get-missing.sh
      - name: "lake build"
        run: lake build --wfail --iofail @complexitylib @/mk_all @/checkInitImports @mathlib/lint-style
      - name: "lake test"
        id: test
        run: lake test --wfail --iofail
      - name: "lake lint"
        id: lint
        run: lake lint
      # As lean-action did: keep a successful build even when tests or linting fail. Only `main`
      # pushes save: each save is about 2.8 GB, and PR or merge-queue copies would evict `main`'s
      # entry from the 10 GB Actions cache. Other runs restore `main`'s entry through the
      # restore-keys prefix and fetch anything newer from the remote cache.
      - name: Save .lake to the Actions cache
        if: >-
          ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
              steps.lake-cache.outputs.cache-hit != 'true' &&
              (success() || steps.test.outcome == 'failure' || steps.lint.outcome == 'failure') }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      # Source hygiene that needs the build outputs: each module's count of public statements that
      # mention tidy computability (#456) must equal its baseline; proofs may use it. See
      # scripts/check_tidy_surface.py. Its tests on a compiled module need Lean, so the Python
      # tests at the start skip them; they run here.
      - name: "Tidy statement ratchet"
        run: |
          set -e
          command -v lake
          test -d .lake/packages
          python3 -B -m unittest scripts/test_check_tidy_surface.py
          python3 -B scripts/check_tidy_surface.py
      - name: "lake exe mk_all --check"
        run: |
          set -e
          lake exe mk_all --check
      - name: Test import generation with custom source directories
        run: |
          test -x .lake/build/bin/mk_all
          python3 -B -m unittest discover -s scripts -p 'test_mk_all.py'
      - name: "lake exe lint-style"
        run: |
          set -e
          lake exe lint-style
      - name: "checkInitImports"
        run: |
          set -e
          lake exe checkInitImports
      # Publish the build outputs to the remote cache read by scripts/cache/get.sh. Skipped until
      # the maintainer sets the repository variables described in scripts/cache/README.md.
      - name: "Authenticate to the remote cache"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LAKE_CACHE_BUCKET != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.LAKE_CACHE_WIF_PROVIDER }}
          service_account: ${{ vars.LAKE_CACHE_SERVICE_ACCOUNT }}
      - name: "Upload to the remote cache"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LAKE_CACHE_BUCKET != ''
        run: |
          set -e
          scripts/cache/upload.sh "${{ vars.LAKE_CACHE_BUCKET }}"
